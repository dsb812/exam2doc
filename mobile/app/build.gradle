plugins {
    id 'com.android.application'
}

android {
    namespace 'com.drok.exam2doc'
    compileSdk 34

    defaultConfig {
        applicationId "com.drok.exam2doc"
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName "1.1.3"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            storeFile file("../../keystore/exam2doc.jks")
            storePassword "exam2doc2026"
            keyAlias "exam2doc"
            keyPassword "exam2doc2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    implementation 'org.opencv:opencv:4.10.0'
}
